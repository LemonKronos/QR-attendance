# Copy this template to .streamlit/secrets.toml for local use,
# or paste the completed contents into Streamlit Community Cloud -> App settings -> Secrets.
# Never commit the completed secrets.toml file.

PUBLIC_BASE_URL = "https://your-app-name.streamlit.app"
TEACHER_PASSWORD = "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
APP_SECRET_KEY = "REPLACE_WITH_64_HEX_CHAR_RANDOM_VALUE"
SHEET_URL = "https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/edit"

[gcp_service_account]
type = "service_account"
project_id = "YOUR_GOOGLE_CLOUD_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_PRIVATE_KEY_BODY\n-----END PRIVATE KEY-----\n"
client_email = "YOUR_SERVICE_ACCOUNT_EMAIL"
client_id = "YOUR_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "YOUR_CLIENT_CERTIFICATE_URL"
universe_domain = "googleapis.com"
